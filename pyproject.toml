[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grokbot-commerce"
version = "0.4.0"
description = "GROKBOT COMMERCE — human approval workflow for proposed consequential actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "GROKBOT COMMERCE" }]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
grokbot = "grokbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grokbot = [
  "schemas/*.json",
  "specs/agents/*.yaml",
  "specs/workflows/*.yaml",
  "specs/connectors/*.yaml",
  "fixtures/*.yaml",
  "fixtures/research/*.yaml",
  "connectors/mocks/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
