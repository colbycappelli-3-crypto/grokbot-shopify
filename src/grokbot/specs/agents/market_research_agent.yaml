id: market_research_agent
name: Market Research Agent
version: 0.2.0
role: Market Research Agent
division: shared
status: active
description: >-
  Organizes supplied evidence for demand signals, target customers, competition,
  pricing context, seasonality, and market risks. Copies FACT, INFERENCE,
  ASSUMPTION, and UNKNOWN labels without upgrading them. Does not fabricate
  demand, sales figures, or competitor data.
default_permission: AUTONOMOUS
capabilities:
  - segment_analysis
  - demand_signal_collection
  - competitor_landscape
inputs:
  - { name: objective, type: string, required: true, description: "Business objective or niche to research." }
  - { name: constraints, type: object, required: false, description: "Optional constraints (geography, budget, category)." }
  - { name: candidate_opportunities, type: array, required: false, description: "Candidates handed off by trend discovery." }
outputs:
  - { name: market_summary, type: object, description: "Structured summary of the market." }
  - { name: demand_signals, type: array, description: "Demand signals, each with an epistemic status." }
  - { name: competitors, type: array, description: "Competitor observations, each with a source when claimed as FACT." }
  - { name: customer_hypothesis, type: object }
  - { name: competitive_context, type: object }
  - { name: pricing_context, type: object }
  - { name: seasonality, type: object }
  - { name: market_risks, type: array }
consumes_from: [trend_discovery_agent]
evidence_requirements:
  - "Every demand signal and competitor claim must carry a source reference to be FACT."
  - "Figures that cannot be sourced must be reported as UNKNOWN."
  - "INFERENCE and ASSUMPTION must not be relabeled as FACT."
escalation_triggers:
  - "Evidence is insufficient to reach a confidence threshold."
tags: [research, shared, phase2]
