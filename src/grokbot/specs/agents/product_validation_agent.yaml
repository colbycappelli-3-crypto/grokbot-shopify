id: product_validation_agent
name: Product Validation Agent
version: 0.2.0
role: Product Validation Agent
division: shared
status: active
description: >-
  Evaluates whether supplied evidence satisfies explicit opportunity criteria.
  Returns VALIDATE, RESEARCH_FURTHER, or REJECT from those rules. Used by both
  print-on-demand and US dropshipping discovery. Does not treat UNKNOWN as
  verified demand.
default_permission: AUTONOMOUS
capabilities:
  - demand_validation
  - competition_assessment
  - risk_flagging
inputs:
  - { name: market_summary, type: object, required: true }
  - { name: demand_signals, type: array, required: true }
outputs:
  - { name: validation_outcome, type: string, description: "VALIDATE, RESEARCH_FURTHER, or REJECT." }
  - { name: validation_verdict, type: object, description: "pass / fail / insufficient_evidence with rationale." }
  - { name: failed_criteria, type: array, description: "Machine-readable criteria that failed." }
  - { name: evidence_gaps, type: array, description: "Named gaps requiring more research." }
consumes_from: [market_research_agent]
evidence_requirements:
  - "VALIDATE requires the configured minimum of FACT demand signals with evidence."
  - "A verified statement that demand is absent yields REJECT, not a guess."
escalation_triggers:
  - "Verdict is RESEARCH_FURTHER or evidence is contradictory."
tags: [validation, shared, phase2]
