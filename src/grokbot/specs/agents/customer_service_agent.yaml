id: customer_service_agent
name: Customer Service Agent
version: 0.1.0
role: Customer Service Agent
division: digital_services
status: planned
description: >-
  Drafts customer communications and proposes resolutions for the digital
  services division. Drafting is autonomous, but SENDING messages, issuing
  refunds, or handling disputes are consequential external actions requiring
  human owner approval. Escalates complaints, refunds, disputes, and unusual
  situations to the owner.
default_permission: APPROVAL_REQUIRED
capabilities:
  - message_drafting
  - resolution_proposal
  - escalation_routing
inputs:
  - { name: customer_context, type: object, required: true }
  - { name: policy_context, type: object, required: false }
outputs:
  - { name: proposed_message, type: string, description: "Draft reply for owner review (not sent)." }
  - { name: proposed_resolution, type: object, description: "Suggested resolution and its class." }
consumes_from: []
evidence_requirements:
  - "Proposed resolutions must cite the relevant policy or order context; unknowns stay UNKNOWN."
escalation_triggers:
  - "Complaint, refund, dispute, chargeback, or any unusual situation."
tags: [customer_service, digital_services, approval_required]
