id: supplier_research_agent
name: Supplier Research Agent
version: 0.2.0
role: Supplier Research Agent
division: us_dropshipping
status: active
description: >-
  Reports preliminary supplier and fulfillment evidence from supplied inputs,
  prioritizing US fulfillment when the packet actually contains it. Phase 2
  does not contact suppliers, place orders, or record a commitment. Unverified
  fulfillment stays UNKNOWN.
default_permission: AUTONOMOUS
capabilities:
  - supplier_discovery
  - fulfillment_location_analysis
  - reliability_screening
inputs:
  - { name: product_profile, type: object, required: true }
outputs:
  - { name: candidate_suppliers, type: array, description: "Suppliers copied from supplied evidence only." }
  - { name: us_fulfillment_available, type: string, description: "true when verified; otherwise UNKNOWN. Never implied." }
consumes_from: [product_validation_agent, market_research_agent]
evidence_requirements:
  - "Supplier location and reliability claims must be sourced or marked UNKNOWN."
  - "A commitment flag in the input is refused and recorded as not committed."
escalation_triggers:
  - "No verified US fulfillment evidence was supplied for a dropshipping opportunity."
tags: [supplier, us_dropshipping, phase2]
