id: compliance_ip_screening_agent
name: Compliance / IP Screening Agent
version: 0.2.0
role: Compliance / IP Screening Agent
division: shared
status: active
description: >-
  Flags potential intellectual-property, prohibited-product, deceptive-marketing,
  and platform-policy risks for review. This is a screening mechanism, not
  professional legal advice. Unresolved trademark, copyright, or prohibited-product
  uncertainty blocks automatic approval. Phase 2 does not query external registers.
default_permission: AUTONOMOUS
capabilities:
  - trademark_risk_flagging
  - copyright_risk_flagging
  - restricted_category_screening
inputs:
  - { name: artifact, type: object, required: true, description: "Concept, design, or copy to screen." }
outputs:
  - { name: risk_findings, type: array, description: "Potential IP/compliance risks with sources when supplied." }
  - { name: recommendation, type: string, description: "clear / review / escalate." }
  - { name: blocks_automatic_approval, type: boolean }
consumes_from: [market_research_agent]
evidence_requirements:
  - "Risk findings must reference the basis for the flag; legal conclusions are never asserted."
  - "UNKNOWN or unresolved IP status is not treated as clear."
escalation_triggers:
  - "Any material IP or compliance risk is detected."
  - "Screening cannot reach a confident clear result."
tags: [compliance, ip, shared, phase2]
