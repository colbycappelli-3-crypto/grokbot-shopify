id: mock_shopify_catalog
name: Mock Shopify Catalog
version: 0.3.0
mode: mock
access: read_only
divisions: [shared, print_on_demand, us_dropshipping]
operations_allowed: [search, describe]
operations_forbidden:
  - publish
  - purchase
  - create_order
  - place_order
  - send_message
  - refund
  - launch_store
  - contact_supplier
  - update_product
  - create_listing
  - modify_shopify
  - connect
credentials_required: false
production_connected: false
description: >-
  TEST/MOCK view of a catalog that is not connected to a production Shopify
  store. Describe and search do not create or publish products.
