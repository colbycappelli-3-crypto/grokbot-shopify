name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: offline validation and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Validate specifications
        run: python -m grokbot validate

      - name: Run tests
        run: python -m pytest

      - name: Run read-only division research
        run: |
          python -m grokbot research pod_research_review --packet pod_research_ready
          python -m grokbot research us_dropship_research_review --packet dropship_research_ready
          python -m grokbot research fiverr_service_research_review --packet fiverr_revision_ready

      - name: Demonstrate the mock approval workflow
        run: python -m grokbot approve demo
